name: calendar
# Once an hour: saves the free Forex Factory week calendar as docs/calendar.json for the desk.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: calendar
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch calendar
        run: |
          curl -sf -A "Mozilla/5.0 (signal-desk)" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o /tmp/cal.json || exit 0
          python3 -c "import json;d=json.load(open('/tmp/cal.json'));assert isinstance(d,list) and len(d)>10" || exit 0
          cp /tmp/cal.json docs/calendar.json
          git config user.name gold-bot; git config user.email gold-bot@users.noreply.github.com
          git add docs/calendar.json
          git diff --cached --quiet || (git commit -m "calendar" && (git push || (git pull --rebase && git push)))
